[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
wysiwys_guard = "9wCcjb74o2cWcFx8GimQQMcR1nJay9X86v1JiyV9kwya"
# Local tests only. Never deploy to devnet.
test_forwarder = "EZFysCCewwyWGMoGPySCLRqNQUcz1sVLJbZCUKFWwkcr"

[programs.devnet]
wysiwys_guard = "9wCcjb74o2cWcFx8GimQQMcR1nJay9X86v1JiyV9kwya"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "NODE_OPTIONS='--import tsx' npx mocha --exit -t 1000000 'tests/**/*.ts'"

[hooks]

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899

# Squads v4 loaded from a devnet dump so tests run offline and deterministically.
[[test.genesis]]
address = "SQDS4ep65T869zMMBKyuUq6aD6EgTu8psMjkvj52pCf"
program = "tests/fixtures/squads_multisig.so"

# Metaplex Token Metadata (mUSD name and symbol), devnet dump, for the bootstrap test.
[[test.genesis]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
program = "tests/fixtures/mpl_token_metadata.so"

# Chainlink's CRE simulator mock forwarder and its devnet state account (devnet dumps), so local
# end-to-end tests deliver reports exactly like `cre workflow simulate --broadcast`.
[[test.genesis]]
address = "7kuEAA3mSC1Tz8gQjnvH7bKFda9xSPRRin9SZbH49cNK"
program = "tests/fixtures/mock_forwarder.so"

[[test.validator.account]]
address = "5Tipz3yhTBdVsDbaBxZkrp7Gjf3brGq5SKkxReefPMP7"
filename = "tests/fixtures/mock_forwarder_state.json"

[[test.validator.account]]
address = "BSTq9w3kZwNwpBXJEvTZz2G9ZTNyKBvoSeXMvwb4cNZr"
filename = "tests/fixtures/squads_program_config.json"
