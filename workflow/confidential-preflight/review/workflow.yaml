# Wysiwys review workflow: simulation only (the guard config points at the CRE simulator's mock forwarder).
local-simulation:
  user-workflow:
    workflow-name: "wysiwys-review-local"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.local.json"
    secrets-path: "../review-secrets.yaml"
staging-settings:
  user-workflow:
    workflow-name: "wysiwys-review"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../review-secrets.yaml"

# Live DON deployment (branch feat/live-don): plain DON handler, production Keystone forwarder.
live-devnet:
  user-workflow:
    workflow-name: "wysiwys-review-live"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.live.json"
    secrets-path: "../review-secrets.yaml"
