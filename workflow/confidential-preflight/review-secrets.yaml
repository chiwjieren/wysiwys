# Review workflow secrets: names only, values come from the project .env (gitignored).
secretsNames:
  QUICKNODE_SOLANA_DEVNET_RPC_URL:
    - CRE_QUICKNODE_SOLANA_DEVNET_RPC_URL
  HELIUS_SOLANA_DEVNET_RPC_URL:
    - CRE_HELIUS_SOLANA_DEVNET_RPC_URL
  ALCHEMY_SOLANA_DEVNET_RPC_URL:
    - CRE_ALCHEMY_SOLANA_DEVNET_RPC_URL
  SCORECHAIN_SANCTIONS_API_KEY:
    - CRE_SCORECHAIN_SANCTIONS_API_KEY
  # The private policy: one document (workflow/policy.json) or a registry array of documents
  # (scripts/policy-hash.ts --registry), one line of JSON. The workflow uses the one whose hash the
  # treasury's GuardConfig names, so treasuries on older policies keep working after a voted change.
  POLICY_DOCUMENT:
    - CRE_POLICY_DOCUMENT
