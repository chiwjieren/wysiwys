[package]
name = "wysiwys_guard"
version = "0.1.0"
description = "Wysiwys guard: executes a Squads v4 payment only after human approval and a matching CRE review"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "wysiwys_guard"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
# Local tests only: shortens the policy change waiting period (constants.rs). Never for devnet builds.
short-policy-delay = []

[dependencies]
anchor-lang = "1.2.0"
solana-sha256-hasher = { version = "3", features = ["sha2"] }
solana-instructions-sysvar = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
